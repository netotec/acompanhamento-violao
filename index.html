<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b1a12">
<title>Violão – Meus exercícios</title>
<style>
  html, body { margin:0; height:100%; background:#fbf7ef; font:16px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; color:#2a1d15; }
  iframe { border:0; width:100%; height:100%; display:block; }
  [hidden] { display:none !important; }
  #aviso { max-width:420px; margin:0 auto; padding:56px 20px; text-align:center; }
  #aviso h1 { font:400 26px Georgia, serif; margin:8px 0; }
  #aviso p { color:#7d6a5a; }
  #aviso .nota { font-size:52px; color:#c8741f; }
</style>
</head>
<body>
<iframe id="app" title="Meus exercícios de violão" hidden></iframe>
<div id="aviso" hidden>
  <div class="nota">♫</div>
  <h1>Link incompleto</h1>
  <p>Abra o link completo que o professor enviou pelo WhatsApp. Ele termina com <b>?t=</b> e um código.</p>
</div>

<script>
  // Endereço do web app do Apps Script (a mesma implantação oficial). Não é segredo: é o que já vai nos links.
  var EXEC = 'https://script.google.com/macros/s/AKfycbzGdGxdk7-yfvmZuffnSb3xKzsb_wGu79eqeYzqEUHE2FHczwO09kY5x3J3s2kMkOkg/exec';

  var token = new URLSearchParams(location.search).get('t') || '';
  var frame = document.getElementById('app');

  if (!/^[a-f0-9]{8,64}$/i.test(token)) {
    document.getElementById('aviso').hidden = false;
  } else {
    // O código do aparelho fica guardado AQUI (endereço próprio, sem bloqueio do navegador) e é repassado ao app.
    var aparelho = '';
    try {
      aparelho = localStorage.getItem('violao_aparelho_topo') || '';
      if (!/^[a-z0-9]{12,40}$/i.test(aparelho)) {
        aparelho = (window.crypto && crypto.randomUUID ? crypto.randomUUID() : (Date.now().toString(36) + Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2)))
          .replace(/[^a-z0-9]/gi, '').slice(0, 32);
        localStorage.setItem('violao_aparelho_topo', aparelho);
      }
    } catch (e) { aparelho = ''; }
    var destino = EXEC + '?t=' + encodeURIComponent(token) + (aparelho ? '&a=' + aparelho : '');
    var abrirDireto = function () { location.replace(destino); };

    // Alguns navegadores (Safari/iPhone) bloqueiam o app dentro de um quadro e mostram "página não encontrada".
    // Por isso: o app avisa quando carrega; se o aviso não chegar em 8 segundos, abre direto, sem quadro.
    // Quando isso acontece, lembra e já abre direto nas próximas vezes.
    var direto = false;
    try { direto = localStorage.getItem('violao_direto') === '1'; } catch (e) {}

    if (direto) {
      abrirDireto();
    } else {
      var pronto = false;
      window.addEventListener('message', function (ev) {
        var d = ev.data;
        var origemOk = ev.origin === location.origin || /^https:\/\/([a-z0-9-]+\.)*(googleusercontent|google)\.com$/i.test(ev.origin);
        if (origemOk && d && d.violao === 'pronto') pronto = true;
      });
      setTimeout(function () {
        if (pronto) return;
        try { localStorage.setItem('violao_direto', '1'); } catch (e) {}
        abrirDireto();
      }, 8000);
      frame.src = destino;
      frame.hidden = false;
    }
  }
</script>
</body>
</html>
