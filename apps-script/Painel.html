<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Nunito:wght@400;600;800&display=swap">
<style>
  /* Mesmo mundo da página da aluna: braço de violão + papel de partitura */
  :root {
    --madeira:#2b1a12; --madeira2:#3a2418; --corda:#d9c7a3; --marcador:#efe6d2;
    --papel:#fbf7ef; --pauta:#e7dccb; --tinta:#2a1d15; --suave:#7d6a5a;
    --ambar:#c8741f; --ambar-escuro:#9a5212; --ok:#3d7a4f; --ok-bg:#e8f2ea;
    --alerta:#a13a26; --alerta-bg:#fbe9e6; --aviso:#8a6510; --aviso-bg:#fdf3d8; --info:#2f5f8a; --info-bg:#e6eff7;
    --titulo:'DM Serif Display', Georgia, serif; --texto:'Nunito', -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--papel); color:var(--tinta); font:15px/1.45 var(--texto); }
  button, select, input, textarea { font:inherit; color:inherit; }

  header { background:linear-gradient(180deg,var(--madeira2),var(--madeira)); color:var(--marcador); position:relative; overflow:hidden; }
  header::before { content:''; position:absolute; inset:0; opacity:.35;
    background:repeating-linear-gradient(180deg,transparent 0 17px,var(--corda) 17px 18px); }
  .topo { max-width:1120px; margin:0 auto; padding:18px 16px 0; position:relative; }
  .topo h1 { font-family:var(--titulo); font-weight:400; font-size:28px; margin:0; text-shadow:0 2px 6px rgba(0,0,0,.5); }
  .topo p { margin:2px 0 12px; color:#d8c9ad; font-size:13px; }
  nav { display:flex; gap:4px; overflow-x:auto; scrollbar-width:none; }
  nav::-webkit-scrollbar { display:none; }
  nav button { flex:none; border:0; background:rgba(0,0,0,.35); color:var(--marcador); padding:9px 14px; border-radius:10px 10px 0 0; cursor:pointer; font-weight:700; white-space:nowrap; }
  nav button.on { background:var(--papel); color:var(--tinta); }
  nav button:focus-visible { outline:2px solid var(--ambar); outline-offset:-2px; }

  main { max-width:1120px; margin:0 auto; padding:18px 16px 60px; }
  h2 { font-family:var(--titulo); font-weight:400; font-size:23px; margin:4px 0 12px; }
  h3 { margin:0; font-size:16px; }
  .sub { color:var(--suave); font-size:13px; margin:-8px 0 14px; }
  .grade { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:14px; }
  .cartao { background:#fff; border:1px solid var(--pauta); border-radius:14px; padding:14px 16px; min-width:0; }
  .cartao + .cartao { margin-top:0; }
  .linha { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .entre { justify-content:space-between; }
  .mut { color:var(--suave); font-size:13px; }
  .num { font-family:var(--titulo); font-size:26px; color:var(--ambar-escuro); line-height:1; }
  .numeros { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:12px 0; }
  .numeros div { background:var(--papel); border-radius:10px; padding:8px; text-align:center; }
  .numeros span { display:block; font-size:11px; color:var(--suave); text-transform:uppercase; letter-spacing:.05em; font-weight:800; margin-top:4px; }
  .selo { display:inline-flex; align-items:center; gap:4px; font-size:12px; font-weight:800; border-radius:999px; padding:2px 9px; white-space:nowrap; }
  .s-ok { background:var(--ok-bg); color:var(--ok); }
  .s-alerta { background:var(--alerta-bg); color:var(--alerta); }
  .s-aviso { background:var(--aviso-bg); color:var(--aviso); }
  .s-info { background:var(--info-bg); color:var(--info); }
  .s-neutro { background:var(--papel); color:var(--suave); border:1px solid var(--pauta); }

  .bt { border:1px solid var(--pauta); background:#fff; border-radius:10px; padding:8px 12px; cursor:pointer; font-weight:700; }
  .bt:hover { border-color:var(--madeira); }
  .bt.pri { background:linear-gradient(180deg,var(--ambar),var(--ambar-escuro)); color:#fff; border:0; }
  .bt.pri:hover { filter:brightness(1.07); }
  .bt.escuro { background:var(--madeira); color:var(--marcador); border-color:var(--madeira); }
  .bt.peq { padding:5px 9px; font-size:13px; }
  .bt:disabled { opacity:.55; cursor:default; }
  .bt:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible { outline:3px solid var(--ambar); outline-offset:1px; }
  a.bt { text-decoration:none; display:inline-flex; align-items:center; gap:6px; color:inherit; }
  a.bt.zap { background:#1f8f4e; color:#fff; border:0; }
  #sair, #atualizar { background:transparent; color:var(--marcador); border-color:rgba(239,230,210,.45); position:relative; }
  #sair:hover, #atualizar:hover { background:rgba(0,0,0,.25); }

  label.campo { display:block; font-weight:800; font-size:13px; margin:10px 0 4px; }
  select, input[type=text], input[type=tel], input[type=number], input[type=date], input[type=time], textarea {
    width:100%; padding:9px 10px; border:1px solid var(--pauta); border-radius:10px; background:#fff; }
  .form { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:0 12px; }
  .resultado { margin-top:14px; background:var(--papel); border:1px dashed var(--ambar); border-radius:12px; padding:12px; word-break:break-all; }

  /* frequência */
  .aula { display:grid; grid-template-columns:92px 1fr auto; gap:12px; align-items:center; background:#fff; border:1px solid var(--pauta); border-radius:12px; padding:10px 12px; margin-bottom:8px; }
  .aula.pendente { border-color:var(--ambar); box-shadow:0 0 0 3px rgba(200,116,31,.12); }
  .data { text-align:center; border-right:1px solid var(--pauta); padding-right:10px; }
  .data b { display:block; font-family:var(--titulo); font-weight:400; font-size:22px; line-height:1; }
  .data span { font-size:11px; color:var(--suave); text-transform:uppercase; font-weight:800; }
  .acoes { display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; }
  .falta-box { grid-column:1 / -1; display:flex; gap:8px; flex-wrap:wrap; align-items:center; background:var(--alerta-bg); border-radius:10px; padding:8px; }
  .falta-box select { width:auto; flex:1; min-width:160px; }

  /* tabelas editáveis */
  .tabela { width:100%; border-collapse:collapse; }
  .tabela th { text-align:left; font-size:12px; color:var(--suave); text-transform:uppercase; letter-spacing:.04em; padding:6px; border-bottom:1px solid var(--pauta); }
  .tabela td { padding:6px; border-bottom:1px solid var(--pauta); vertical-align:middle; }
  .rolagem { overflow-x:auto; }

  .feed .item { padding:10px 0; border-bottom:1px solid var(--pauta); }
  .feed .item:last-child { border-bottom:0; }
  .coment { margin-top:4px; background:var(--papel); border-left:3px solid var(--ambar); padding:6px 10px; border-radius:6px; font-size:14px; }

  .vazio { text-align:center; color:var(--suave); padding:30px 10px; }
  .carregando { text-align:center; padding:60px 10px; color:var(--suave); }
  .toast { cursor:pointer; position:fixed; left:50%; bottom:18px; transform:translateX(-50%); max-width:min(560px,calc(100% - 32px)); background:var(--madeira); color:var(--marcador); padding:12px 16px; border-radius:12px; box-shadow:0 8px 24px rgba(0,0,0,.3); z-index:20; white-space:pre-line; }
  .toast.erro { background:var(--alerta); color:#fff; }
  .toast[hidden] { display:none; }

  .cartoes-rel { display:none; }
  .reacoes { display:flex; gap:6px; flex-wrap:wrap; margin:6px 0; }
  .alunos-resumo { display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; }

  @media (max-width:640px) {
    main { padding:14px 12px 60px; }
    .topo { padding:14px 12px 0; }
    .topo h1 { font-size:23px; }
    /* 16px nos campos: o iPhone não dá zoom ao tocar */
    input, select, textarea { font-size:16px; }
    /* alvos de toque maiores */
    .bt { min-height:44px; }
    .bt.peq { min-height:42px; padding:8px 12px; }
    nav button { padding:12px 14px; }
    .reacoes { display:grid; grid-template-columns:1fr 1fr; }
    .reacoes .bt { width:100%; padding:8px 6px; }
    .acoes .bt { flex:1 1 auto; }
    .grade { grid-template-columns:1fr; }
    .tabela-rel { display:none; }
    .cartoes-rel { display:grid; gap:10px; }
    .tabela.responsiva td[data-l]::before { content:attr(data-l); display:block; font-size:11px; font-weight:800; color:var(--suave); text-transform:uppercase; letter-spacing:.04em; }
    .toast { bottom:calc(14px + env(safe-area-inset-bottom, 0px)); }
    .aula { grid-template-columns:70px 1fr; }
    .acoes { grid-column:1 / -1; justify-content:flex-start; }
    .tabela.responsiva thead { display:none; }
    .tabela.responsiva tr { display:grid; grid-template-columns:1fr 1fr; gap:6px; padding:8px 0; border-bottom:1px solid var(--pauta); }
    .tabela.responsiva td { border:0; padding:0; }
  }
  @media (prefers-reduced-motion: no-preference) { .cartao, .aula { transition:border-color .2s; } }
</style>
</head>
<body>
<header>
  <div class="topo">
    <div class="linha entre"><h1>Painel do Professor</h1>
      <div class="linha" style="flex-wrap:nowrap">
        <button class="bt peq" id="atualizar" type="button" hidden>↻ Atualizar</button>
        <button class="bt peq" id="sair" type="button" hidden>Sair</button>
      </div></div>
    <p id="hoje">Violão · acompanhamento das aulas</p>
    <nav id="abas" role="tablist"></nav>
  </div>
</header>
<main id="app"><div class="carregando">♪ Carregando…</div></main>
<div class="toast" id="toast" role="status" hidden></div>

<script>
  let CHAVE = <?!= JSON.stringify(chave) ?>;
  const MODO = <?!= JSON.stringify(modo) ?>;
  let D = null;
  let aba = 'geral';
  let filtroAluno = '';
  let preEnvio = {};
  let ultimoEnvio = null;
  const app = document.getElementById('app');
  const ABAS = [['geral', 'Visão geral'], ['enviar', 'Enviar link'], ['freq', 'Frequência'], ['evo', 'Evolução'], ['rel', 'Relatório'], ['aulas', 'Aulas'], ['alunos', 'Alunos'], ['planos', 'Planos'], ['pagto', 'Mensalidades'], ['disp', 'Disponibilidade'], ['praticas', 'Práticas']];
  let aulaAberta = '';
  let periodo = null;
  let evoAluno = '', evoAula = '', evoData = '', alunoAberto = '', editandoEndereco = false, mesPagto = '';
  let limitePraticas = 50;
  const DIAS = ['Domingo', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'];
  const MOTIVOS = ['Doença', 'Trabalho', 'Estudos', 'Viagem', 'Compromisso familiar', 'Transporte', 'Esqueceu', 'Outro'];

  /* ---------- utilidades ---------- */
  function el(tag, attrs, ...filhos) {
    const e = document.createElement(tag);
    Object.entries(attrs || {}).forEach(([k, v]) => {
      if (v === false || v == null) return;
      if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
      else if (k === 'value') e.value = v;
      else e.setAttribute(k, v === true ? '' : v);
    });
    filhos.flat().forEach(f => { if (f == null || f === false) return; e.append(f instanceof Node ? f : document.createTextNode(String(f))); });
    return e;
  }
  function chamar(fn, ...args) {
    return new Promise((ok, falha) => {
      google.script.run.withSuccessHandler(ok).withFailureHandler(e => {
        const msg = String(e.message || e).replace(/^Error:\s*/, '');
        if (/^SESSAO:/.test(msg)) { esquecerSessao(); telaLogin(msg.replace(/^SESSAO:\s*/, '')); const er = new Error('Entre de novo com a senha.'); er.sessao = true; falha(er); return; }
        falha(new Error(msg));
      })[fn](CHAVE, ...args);
    });
  }

  /* ---------- login (só no app/web; dentro da planilha não precisa) ---------- */
  const guardar = (k, v, longo) => { try { (longo ? localStorage : sessionStorage).setItem(k, v); } catch (e) {} };
  const ler = k => { try { return localStorage.getItem(k) || sessionStorage.getItem(k) || ''; } catch (e) { return ''; } };
  function esquecerSessao() { try { localStorage.removeItem('violao_sessao'); sessionStorage.removeItem('violao_sessao'); } catch (e) {} CHAVE = ''; }
  function telaLogin(aviso) {
    document.getElementById('abas').innerHTML = '';
    document.getElementById('sair').hidden = true;
    document.getElementById('atualizar').hidden = true;
    app.innerHTML = '';
    const senha = el('input', { type: 'password', id: 'senha', autocomplete: 'current-password', placeholder: 'Sua senha' });
    const lembrar = el('input', { type: 'checkbox', id: 'lembrar', checked: true });
    const msg = el('div', { class: 'mut', role: 'status', style: 'margin-top:10px;min-height:1.4em' }, aviso || '');
    const entrar = async btn => {
      if (!senha.value) { msg.textContent = 'Digite a senha.'; return; }
      btn.disabled = true; btn.textContent = 'Entrando…';
      google.script.run.withSuccessHandler(token => {
        CHAVE = token; guardar('violao_sessao', token, lembrar.checked); carregar();
      }).withFailureHandler(e => {
        btn.disabled = false; btn.textContent = 'Entrar';
        msg.textContent = String(e.message || e).replace(/^Error:\s*/, ''); msg.style.color = 'var(--alerta)';
        senha.select();
      }).painelLogin(senha.value, lembrar.checked);
    };
    const bt = el('button', { class: 'bt pri', type: 'button', style: 'width:100%;margin-top:14px;padding:12px', onclick: e => entrar(e.currentTarget) }, 'Entrar');
    senha.addEventListener('keydown', e => { if (e.key === 'Enter') entrar(bt); });
    app.append(el('div', { class: 'cartao', style: 'max-width:380px;margin:30px auto' },
      el('h2', { style: 'margin-top:0' }, '🔒 Área do professor'),
      el('p', { class: 'mut', style: 'margin-top:-6px' }, 'Digite a senha do painel para continuar.'),
      el('label', { class: 'campo', for: 'senha' }, 'Senha'), senha,
      el('label', { class: 'linha', style: 'margin-top:10px;font-size:14px;cursor:pointer' }, lembrar, 'Lembrar neste aparelho por 30 dias'),
      bt, msg));
    setTimeout(() => senha.focus(), 50);
  }
  // Atualizar: busca os dados de novo (útil depois de mexer na planilha ou de outro aparelho gravar)
  document.getElementById('atualizar').addEventListener('click', async e => {
    const btn = e.currentTarget;
    btn.disabled = true; btn.textContent = 'Atualizando…';
    try { await carregar(true); toast('Dados atualizados.'); }
    finally { btn.disabled = false; btn.textContent = '↻ Atualizar'; }
  });
  document.getElementById('sair').addEventListener('click', () => {
    const k = CHAVE; esquecerSessao();
    google.script.run.withSuccessHandler(() => {}).withFailureHandler(() => {}).painelSair(k);
    telaLogin('Você saiu do painel.');
  });
  let tToast;
  function toast(msg, erro) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.className = 'toast' + (erro ? ' erro' : ''); t.hidden = false;
    clearTimeout(tToast); tToast = setTimeout(() => { t.hidden = true; }, Math.max(erro ? 12000 : 9000, msg.length * 80));
    t.onclick = () => { t.hidden = true; };
  }
  function br(iso) { if (!iso || !/^\d{4}-\d{2}-\d{2}$/.test(iso)) return iso || ''; const [y, m, d] = iso.split('-'); return d + '/' + m + '/' + y; }
  function diaSemana(iso) { const [y, m, d] = iso.split('-').map(Number); return DIAS[new Date(y, m - 1, d).getDay()]; }
  function somaDias(iso, n) { const [y, m, d] = iso.split('-').map(Number); const x = new Date(y, m - 1, d + n); return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0'); }
  function nomeDe(id) { const a = D.alunos.find(x => x.id === id); return a ? a.nome : id; }
  function primeiro(n) { return String(n || '').split(' ')[0]; }
  function opcoes(lista, atual, vazio) {
    const s = el('select');
    if (vazio) s.append(el('option', { value: '' }, vazio));
    lista.forEach(([v, t]) => s.append(el('option', { value: v, selected: String(v) === String(atual) }, t)));
    return s;
  }
  async function acao(btn, fn) {
    const txt = btn.textContent; btn.disabled = true; btn.textContent = 'Salvando…';
    try { await fn(); } catch (e) { toast(e.message, true); } finally { btn.disabled = false; btn.textContent = txt; }
  }
  function seletorAluno(atual, aoMudar, rotuloVazio) {
    const s = opcoes(D.alunos.map(a => [a.id, a.nome + ' (' + a.id + ')']), atual, rotuloVazio);
    s.addEventListener('change', () => aoMudar(s.value));
    return s;
  }

  /* ---------- carregar ---------- */
  async function carregar(silencioso) {
    if (!silencioso) app.innerHTML = '<div class="carregando">♪ Carregando…</div>';
    try {
      D = await chamar('painelDados');
      document.getElementById('sair').hidden = MODO !== 'web';
      document.getElementById('atualizar').hidden = false;
      const agora = new Date();
      const hora = String(agora.getHours()).padStart(2, '0') + ':' + String(agora.getMinutes()).padStart(2, '0');
      document.getElementById('hoje').textContent = 'Hoje é ' + diaSemana(D.hoje).toLowerCase() + ', ' + br(D.hoje) + ' · atualizado às ' + hora;
      render();
    } catch (e) {
      if (e && e.sessao) return; // a tela de senha já foi mostrada: não apagar
      app.innerHTML = '';
      app.append(el('div', { class: 'vazio' }, 'Não consegui carregar os dados: ' + e.message));
    }
  }
  function irPara(nova) { aba = nova; render(); window.scrollTo(0, 0); }

  function render() {
    const nav = document.getElementById('abas'); nav.innerHTML = '';
    ABAS.forEach(([id, t]) => nav.append(el('button', { role: 'tab', 'aria-selected': id === aba ? 'true' : 'false', class: id === aba ? 'on' : '', onclick: () => irPara(id) }, t)));
    const ativa = nav.querySelector('.on');
    if (ativa) nav.scrollLeft = ativa.offsetLeft - (nav.clientWidth - ativa.offsetWidth) / 2;
    app.innerHTML = '';
    ({ geral: telaGeral, enviar: telaEnviar, freq: telaFreq, evo: telaEvolucao, rel: telaRelatorio, aulas: telaAulas, alunos: telaAlunos, planos: telaPlanos, pagto: telaPagto, disp: telaDisp, praticas: telaPraticas })[aba]();
  }

  /* ---------- Visão geral ---------- */
  function telaGeral() {
    app.append(el('h2', {}, 'Como estão os alunos'));
    const ativos = D.alunos.filter(a => a.status !== 'Inativo');
    if (!ativos.length) { app.append(el('div', { class: 'vazio' }, 'Nenhum aluno ainda. Cadastre o primeiro na aba Alunos.')); return; }
    const pend = D.freq.filter(f => f.presenca === 'Agendada' && f.data < D.hoje);
    if (pend.length) {
      app.append(el('div', { class: 'cartao', style: 'border-color:var(--ambar);margin-bottom:14px' },
        el('div', { class: 'linha entre' },
          el('div', {}, el('b', {}, pend.length === 1 ? '1 aula passada sem presença marcada' : pend.length + ' aulas passadas sem presença marcada'),
            el('div', { class: 'mut' }, 'Marque Presente ou Falta para manter a frequência certa e agendar reposições.')),
          el('button', { class: 'bt pri', onclick: () => irPara('freq') }, 'Marcar agora'))));
    }
    // quem precisa de atenção vem primeiro: sem link/vencido, muitos dias sem praticar, cadastro pendente
    const peso = a => {
      const r = D.resumo.find(x => x.id === a.id) || {};
      let p = 0;
      if (a.status === 'Pausado') return -1;
      if (!r.envio || !r.envio.ativo) p += 2;
      if (r.diasSemPraticar != null && r.diasSemPraticar >= 3) p += 2;
      if (!a.cadastro) p += 1;
      return p;
    };
    ativos.sort((x, y) => peso(y) - peso(x) || x.nome.localeCompare(y.nome, 'pt-BR'));
    const semPratica = ativos.filter(a => { const r = D.resumo.find(x => x.id === a.id) || {}; return a.status !== 'Pausado' && r.diasSemPraticar != null && r.diasSemPraticar >= 3; }).length;
    if (semPratica) app.append(el('p', { class: 'sub', style: 'margin-top:0' }, semPratica === 1 ? '1 aluno está há 3 dias ou mais sem praticar.' : semPratica + ' alunos estão há 3 dias ou mais sem praticar.'));
    const g = el('div', { class: 'grade' });
    ativos.forEach(a => {
      const r = D.resumo.find(x => x.id === a.id) || {};
      const selos = el('div', { class: 'linha', style: 'margin-top:6px' });
      if (a.status === 'Pausado') selos.append(el('span', { class: 'selo s-neutro' }, 'Pausado'));
      if (!a.cadastro) selos.append(el('span', { class: 'selo s-aviso' }, 'Cadastro pendente'));
      if (a.status === 'Ativo' && statusPagto(a, D.hoje.slice(0, 7)).t === 'atrasado') selos.append(el('span', { class: 'selo s-alerta' }, 'Mensalidade atrasada'));
      if (r.envio) selos.append(el('span', { class: 'selo ' + (r.envio.ativo ? 's-ok' : 's-alerta') }, r.envio.ativo ? 'Link até ' + br(r.envio.validade).slice(0, 5) : 'Link vencido'));
      else selos.append(el('span', { class: 'selo s-neutro' }, 'Sem link enviado'));
      if (r.diasSemPraticar != null && r.diasSemPraticar >= 3) selos.append(el('span', { class: 'selo s-alerta' }, r.diasSemPraticar + ' dias sem praticar'));
      if (r.diasSemPraticar == null && a.cadastro) selos.append(el('span', { class: 'selo s-neutro' }, 'Ainda não praticou'));
      const freq = r.frequencia == null ? '–' : Math.round(r.frequencia * 100) + '%';
      g.append(el('div', { class: 'cartao' },

  /* ---------- Mensalidades: Pix e controle de pagamento ---------- */
  const MESES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
  const TIPOS_PIX = ['CPF', 'CNPJ', 'E-mail', 'Telefone', 'Aleatória'];
  function nomeMes(m) { const [y, mm] = m.split('-').map(Number); return MESES[mm - 1] + ' de ' + y; }
  function somaMes(m, n) { const [y, mm] = m.split('-').map(Number); const d = new Date(y, mm - 1 + n, 1); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); }
  function diasEntre(a, b) { return Math.round((new Date(a) - new Date(b)) / 864e5); }
  // cortesia: plano "Cortesia" ou mensalidade R$ 0 definida (mensalidade em branco NÃO é cortesia)
  const ehCortesia = a => /^cortesia$/i.test(String(a.plano || '').trim()) || (a.valor !== '' && a.valor != null && Number(a.valor) === 0);
  function statusPagto(a, mes) {
    if (ehCortesia(a)) return { t: 'cortesia' };
    const reg = (D.mensalidades || []).find(x => x.aluno === a.id && x.mes === mes);
    if (reg && reg.pago === 'Cortesia') return { t: 'cortesia' };
    if (reg && reg.pago === 'Sim') return { t: 'pago', data: reg.data, valor: reg.valor };
    const dia = String(Math.min(28, Math.max(1, Number((D.financeiro || {}).vencimento) || 10))).padStart(2, '0');
    const venc = mes + '-' + dia;
    if (D.hoje > venc) return { t: 'atrasado', venc: venc, dias: diasEntre(D.hoje, venc) };
    return { t: 'pendente', venc: venc };
  }
  function textoPix() {
    const f = D.financeiro || {};
    return f.chave ? 'Pix (' + f.tipo + '): ' + f.chave + (f.titular ? ' – ' + f.titular : '') : '';
  }

  function telaPagto() {
    const f = D.financeiro || { tipo: '', chave: '', titular: '', vencimento: 10 };

    app.append(el('p', { class: 'sub' }, 'Sua chave Pix e o controle de quem pagou, quem está pendente e quem está atrasado. Alunos com plano Cortesia ficam de fora.'));

    // --- Pix ---
    const tipo = opcoes(TIPOS_PIX.map(t => [t, t]), f.tipo || 'Telefone');
    const chave = el('input', { type: 'text', id: 'pix-chave', value: f.chave, placeholder: 'Sua chave Pix', autocomplete: 'off', autocapitalize: 'off', spellcheck: 'false' });
    const titular = el('input', { type: 'text', id: 'pix-titular', value: f.titular, maxlength: 60, placeholder: 'Nome que aparece no Pix (opcional)' });
    const venc = el('input', { type: 'number', id: 'pix-venc', min: 1, max: 28, value: f.vencimento || 10 });
    const salvar = el('button', { class: 'bt pri', onclick: e => acao(e.currentTarget, async () => {

    // --- mês ---

      el('button', { class: 'bt peq', 'aria-label': 'Mês anterior', onclick: () => { mesPagto = somaMes(mesPagto, -1); render(); } }, '‹'),
      el('h3', { style: 'text-transform:capitalize' }, nomeMes(mesPagto)),

    const cobraveis = D.alunos.filter(a => a.status === 'Ativo');
    if (!cobraveis.length) { app.append(el('div', { class: 'vazio' }, 'Nenhum aluno ativo.')); return; }
    const itens = cobraveis.map(a => ({ a: a, s: statusPagto(a, mesPagto) }));
    const soma = fn => itens.filter(fn).reduce((t, x) => t + (Number(x.a.valor) || 0), 0);
    const recebido = itens.filter(x => x.s.t === 'pago').reduce((t, x) => t + (Number(x.s.valor) || Number(x.a.valor) || 0), 0);

    app.append(el('div', { class: 'cartao', style: 'margin-bottom:14px' },

        el('div', {}, el('div', { class: 'num' }, brl(soma(x => x.s.t === 'pendente'))), el('span', {}, 'a receber')),

          el('span', {}, atrasados.length + (atrasados.length === 1 ? ' atrasado' : ' atrasados'))))));

    // atrasados primeiro, depois pendentes, pagos e cortesias
    const ordem = { atrasado: 0, pendente: 1, pago: 2, cortesia: 3 };
    itens.sort((x, y) => ordem[x.s.t] - ordem[y.s.t] || x.a.nome.localeCompare(y.a.nome, 'pt-BR'));
    const g = el('div', { class: 'grade' });
    itens.forEach(({ a, s }) => {

        atrasado: ['s-alerta', 'Atrasado há ' + s.dias + (s.dias === 1 ? ' dia' : ' dias')],

      const card = el('div', { class: 'cartao' },
        el('div', { class: 'linha entre' }, el('h3', {}, a.nome), el('span', { class: 'selo ' + selo[0] }, selo[1])),
        el('div', { class: 'mut' }, (a.plano || 'Sem plano') + (s.t === 'cortesia' ? '' : ' · ' + (a.valor === '' ? 'defina a mensalidade' : brl(a.valor)))));
      if (s.t !== 'cortesia') {
        const acoes = el('div', { class: 'linha', style: 'margin-top:10px' });
        if (s.t === 'pago') {
          acoes.append(el('button', { class: 'bt peq', onclick: e => acao(e.currentTarget, async () => {
            await chamar('painelMarcarPagamento', a.id, mesPagto, false, ''); toast('Pagamento desfeito.'); await carregar(true);
          }) }, 'Desfazer'));
        } else {

          acoes.append(
            el('button', { class: 'bt pri peq', onclick: e => acao(e.currentTarget, async () => {
              await chamar('painelMarcarPagamento', a.id, mesPagto, true, data.value); toast('Pagamento de ' + primeiro(a.nome) + ' registrado.'); await carregar(true);
            }) }, 'Marcar como pago'), data);
          if (a.telefone) {
            const msg = 'Olá, ' + primeiro(a.nome) + '! Passando para lembrar da mensalidade de ' + nomeMes(mesPagto) +
              (a.valor !== '' ? ' (' + brl(a.valor) + ')' : '') + '.' + (textoPix() ? ' ' + textoPix() + '.' : '') + ' Qualquer dúvida é só falar!';
            acoes.append(el('a', { class: 'bt zap peq', href: 'https://wa.me/55' + String(a.telefone).replace(/\D/g, '') + '?text=' + encodeURIComponent(msg), target: '_blank', rel: 'noopener' }, 'Cobrar no WhatsApp'));
          }
        }
        card.append(acoes);
      }
      g.append(card);
    });
    app.append(g);
  }

  /* ---------- Excluir aluno (com confirmação digitando o nome) ---------- */
  const normaliza = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();
  function abrirExclusao(a, card) {

      el('div', { class: 'form', style: 'margin-top:4px' },
        el('div', {}, el('label', { class: 'campo' }, 'Aula dada'), aulaSel),
        el('div', {}, el('label', { class: 'campo' }, 'Dia da aula'), dataIn)));
    if (!aula || !aula.exercicios.length) {
      c.append(el('div', { class: 'vazio' }, aula ? 'Esta aula ainda não tem exercícios. Cadastre na aba Aulas.' : 'Escolha a aula.'));
    } else {
      const jaTem = Object.keys(escolhas).length;
      if (jaTem) c.append(el('div', { class: 'mut', style: 'margin-top:8px' }, 'Já existe registro deste dia: ao salvar, ele é atualizado.'));
      aula.exercicios.forEach(x => {
        const chips = el('div', { class: 'reacoes' });
        const pintar = () => chips.querySelectorAll('button').forEach(b => {
          const on = escolhas[x.id] === b.getAttribute('data-v');
          b.className = 'bt peq' + (on ? ' escuro' : '');
          b.setAttribute('aria-pressed', on ? 'true' : 'false');
        });
        REACOES.forEach(([nome]) => chips.append(el('button', { type: 'button', 'data-v': nome, class: 'bt peq', onclick: () => {
          escolhas[x.id] = escolhas[x.id] === nome ? '' : nome; pintar();
        } }, nome)));
        const obs = el('input', { type: 'text', maxlength: 300, placeholder: 'Observação (opcional): o que ficou difícil, o que melhorou…', value: notas[x.id] || '' });
        obs.addEventListener('input', () => { notas[x.id] = obs.value; });
        c.append(el('div', { style: 'background:var(--papel);border-radius:10px;padding:10px;margin-top:10px' },
          el('div', { class: 'linha entre' }, el('b', {}, '♪ ' + x.titulo), x.tempo ? el('span', { class: 'mut' }, x.tempo + ' min') : null),
          chips, obs));
        pintar();
      });
      c.append(el('button', { class: 'bt pri', style: 'margin-top:14px', onclick: e => acao(e.currentTarget, async () => {
        const itens = aula.exercicios.map(x => ({ id: x.id, reacao: escolhas[x.id] || '', obs: notas[x.id] || '' }));
        if (!itens.some(i => i.reacao) && !jaTem) throw new Error('Marque como o aluno foi em pelo menos um exercício.');
        const r = await chamar('painelSalvarAvaliacao', evoAluno, evoAula, evoData, itens);
        toast('Registro salvo (' + r.salvos + ' exercício' + (r.salvos === 1 ? '' : 's') + ').');
        await carregar(true);
      }) }, 'Salvar registro da aula'));
    }
    app.append(c);

    // --- evolução por exercício ---
    app.append(el('h3', { style: 'margin:6px 0 8px' }, 'Evolução por exercício'));
    if (!aval.length) { app.append(el('div', { class: 'vazio' }, 'Nenhum registro ainda para ' + primeiro(nomeDe(evoAluno)) + '.')); return; }
    const porEx = {};
    aval.slice().sort((x, y) => (x.data < y.data ? -1 : x.data > y.data ? 1 : 0)).forEach(a => { (porEx[a.ex] = porEx[a.ex] || []).push(a); });
    const g = el('div', { class: 'grade' });
    Object.keys(porEx).forEach(id => {
      const seq = porEx[id];
      const nota = a => (reacaoInfo(a.reacao) || [0, 0, 0])[2];
      let tendencia = null;
      if (seq.length >= 2) {
        const dif = nota(seq[seq.length - 1]) - nota(seq[0]);
        tendencia = dif > 0 ? ['↑ Melhorando', 's-ok'] : dif < 0 ? ['↓ Piorou', 's-alerta'] : ['→ Estável', 's-neutro'];
      }
      const linha = el('div', { class: 'linha', style: 'margin-top:8px' });
      seq.slice(-6).forEach((a, i) => {
        if (i) linha.append(el('span', { class: 'mut' }, '›'));
        linha.append(el('span', { class: 'selo ' + ((reacaoInfo(a.reacao) || [])[1] || 's-neutro'), title: br(a.data) }, br(a.data).slice(0, 5) + ' ' + a.reacao));
      });
      g.append(el('div', { class: 'cartao' },
        el('div', { class: 'linha entre' }, el('b', {}, exTitulo(id)), tendencia ? el('span', { class: 'selo ' + tendencia[1] }, tendencia[0]) : null),
        el('div', { class: 'mut' }, seq.length + (seq.length === 1 ? ' registro' : ' registros')), linha));
    });
    app.append(g);

    // --- histórico por aula ---
    app.append(el('h3', { style: 'margin:18px 0 8px' }, 'Aulas registradas'));
    const dias = {};
    aval.forEach(a => { const k = a.data + '|' + a.aula; (dias[k] = dias[k] || []).push(a); });
    const hist = el('div', { class: 'cartao feed' });
    Object.keys(dias).sort().reverse().forEach(k => {
      const [data, idAula] = k.split('|');
      const itens = el('div', {});
      dias[k].forEach(a => itens.append(el('div', { style: 'margin-top:6px' },
        el('div', { class: 'linha' }, el('span', {}, '♪ ' + exTitulo(a.ex)), el('span', { class: 'selo ' + ((reacaoInfo(a.reacao) || [])[1] || 's-neutro') }, a.reacao)),
        a.obs ? el('div', { class: 'coment' }, a.obs) : null)));
      hist.append(el('div', { class: 'item' },
        el('div', { class: 'linha entre' }, el('b', {}, br(data)), el('span', { class: 'mut' }, aulaTitulo(idAula))), itens));
    });
    app.append(hist);
  }

  /* ---------- Relatório ---------- */
  function mesIso(offset) {
    const [y, m] = D.hoje.split('-').map(Number);
    const ini = new Date(y, m - 1 + offset, 1), fim = new Date(y, m + offset, 0);
    const f = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    return [f(ini), f(fim)];
  }
  function telaRelatorio() {
    app.append(el('h2', {}, 'Relatório de frequência'));
    app.append(el('p', { class: 'sub' }, 'Aulas, presenças, faltas e prática de cada aluno no período escolhido.'));
    if (!periodo) periodo = mesIso(0);
    const de = el('input', { type: 'date', value: periodo[0] });
    const ate = el('input', { type: 'date', value: periodo[1] });
    const res = el('div', { style: 'margin-top:14px' });
    const atalho = (rot, fn) => el('button', { class: 'bt peq', type: 'button', onclick: () => { periodo = fn(); render(); } }, rot);
    app.append(el('div', { class: 'cartao' },
      el('div', { class: 'linha' }, atalho('Este mês', () => mesIso(0)), atalho('Mês passado', () => mesIso(-1)),
        atalho('Últimos 30 dias', () => [somaDias(D.hoje, -29), D.hoje])),
      el('div', { class: 'form', style: 'margin-top:4px' },
        el('div', {}, el('label', { class: 'campo' }, 'De'), de), el('div', {}, el('label', { class: 'campo' }, 'Até'), ate)),
      el('button', { class: 'bt pri', style: 'margin-top:12px', onclick: e => acao(e.currentTarget, async () => {
        periodo = [de.value, ate.value]; await gerarRelatorio(res);
      }) }, 'Gerar relatório')), res);
    gerarRelatorio(res);
  }
  async function gerarRelatorio(res) {
    res.innerHTML = '<div class="carregando">♪ Calculando…</div>';
    let r;
    try { r = await chamar('painelRelatorio', periodo[0], periodo[1]); }
    catch (e) { if (e.sessao) return; res.innerHTML = ''; res.append(el('div', { class: 'vazio' }, e.message)); return; }
    res.innerHTML = '';
    if (!r.linhas.length) { res.append(el('div', { class: 'vazio' }, 'Nenhum aluno no período.')); return; }
    const pct = v => v == null ? '–' : Math.round(v * 100) + '%';
    const cols = ['Aluno', 'Aulas', 'Presente', 'Faltas', 'Justif.', 'Reposição', 'Frequência', 'Dias praticou', 'Minutos'];
    const linhas = r.linhas.map(l => [l.nome, l.realizadas, l.presentes, l.faltas, l.justificadas, l.reposicoes, pct(l.frequencia), l.diasPraticou, l.minutos]);
    const t = el('table', { class: 'tabela' }, el('thead', {}, el('tr', {}, cols.map(h => el('th', {}, h)))));
    const tb = el('tbody');
    linhas.forEach(l => tb.append(el('tr', {}, l.map((v, i) => el('td', { style: i ? 'text-align:center' : 'font-weight:700' }, String(v))))));
    t.append(tb);
    t.className = 'tabela tabela-rel';
    const cartoes = el('div', { class: 'cartoes-rel' });
    r.linhas.forEach(l => cartoes.append(el('div', { class: 'cartao', style: 'background:var(--papel)' },
      el('div', { class: 'linha entre' }, el('b', {}, l.nome), el('span', { class: 'selo ' + (l.frequencia == null ? 's-neutro' : l.frequencia >= 0.75 ? 's-ok' : 's-alerta') }, 'Frequência ' + pct(l.frequencia))),
      el('div', { class: 'numeros' },
        el('div', {}, el('div', { class: 'num' }, String(l.realizadas)), el('span', {}, 'aulas')),
        el('div', {}, el('div', { class: 'num' }, String(l.presentes)), el('span', {}, 'presente')),
        el('div', {}, el('div', { class: 'num' }, String(l.faltas)), el('span', {}, 'faltas')),
        el('div', {}, el('div', { class: 'num' }, String(l.justificadas)), el('span', {}, 'justif.')),
        el('div', {}, el('div', { class: 'num' }, String(l.reposicoes)), el('span', {}, 'reposição')),
        el('div', {}, el('div', { class: 'num' }, String(l.diasPraticou)), el('span', {}, 'dias praticou'))),
      el('div', { class: 'mut' }, l.minutos + ' min de prática no período'))));
    const tsv = [cols.join('\t')].concat(linhas.map(l => l.join('\t'))).join('\n');
    res.append(el('div', { class: 'cartao' },
      el('div', { class: 'linha entre' }, el('b', {}, br(r.de) + ' a ' + br(r.ate)),
        el('button', { class: 'bt peq', onclick: ev => {
          const b = ev.currentTarget;
          const ok = () => { b.textContent = 'Copiado!'; setTimeout(() => { b.textContent = 'Copiar para planilha'; }, 2000); };
          if (navigator.clipboard) navigator.clipboard.writeText(tsv).then(ok, () => prompt('Copie o relatório:', tsv));
          else prompt('Copie o relatório:', tsv);
        } }, 'Copiar para planilha')),
      el('div', { class: 'rolagem', style: 'margin-top:8px' }, t), cartoes,
      el('div', { class: 'mut', style: 'margin-top:8px' }, '"Aulas" conta só as regulares já marcadas; a frequência soma Presente e Reposição.')));
  }

  /* ---------- Aulas ---------- */
  function telaAulas() {
    app.append(el('div', { class: 'linha entre' }, el('h2', {}, 'Aulas do programa'),
      el('button', { class: 'bt escuro', onclick: e => acao(e.currentTarget, async () => {
        const r = await chamar('painelNovaAula'); aulaAberta = r.id; toast('Aula ' + r.numero + ' criada. Edite o conteúdo e os exercícios.'); await carregar(true);
      }) }, '+ Nova aula')));
    app.append(el('p', { class: 'sub' }, 'É isto que o aluno vê no link de cada aula. Toque numa aula para ver ou editar.'));
    D.aulas.forEach(a => {
      const aberta = aulaAberta === a.id;
      const c = el('div', { class: 'cartao', style: 'margin-bottom:10px' + (aberta ? ';border-color:var(--ambar)' : '') });
      const cab = el('button', { type: 'button', class: 'linha entre', 'aria-expanded': aberta ? 'true' : 'false',
        style: 'width:100%;border:0;background:none;padding:0;cursor:pointer;text-align:left',
        onclick: () => { aulaAberta = aberta ? '' : a.id; render(); } },
        el('div', { style: 'min-width:0' }, el('div', { class: 'mut' }, 'Aula ' + a.numero), el('h3', {}, a.titulo)),
        el('div', { class: 'linha' }, el('span', { class: 'selo s-neutro' }, a.exercicios.length + (a.exercicios.length === 1 ? ' exercício' : ' exercícios')),
          a.apostila ? el('span', { class: 'selo s-ok' }, 'Apostila') : null, el('span', { class: 'mut' }, aberta ? '▲' : '▼')));
      c.append(cab);
      if (!aberta) {
        if (a.tarefa) c.append(el('div', { class: 'mut', style: 'margin-top:6px' }, 'Tarefa: ' + a.tarefa));
      } else c.append(editorAula(a));
      app.append(c);
    });
  }
  function editorAula(a) {
    const box = el('div', { style: 'margin-top:10px' });
    const titulo = el('input', { type: 'text', value: a.titulo, maxlength: 80 });
    const conteudo = el('textarea', { rows: 3, maxlength: 500 }); conteudo.value = a.conteudo;
    const tarefa = el('textarea', { rows: 2, maxlength: 300 }); tarefa.value = a.tarefa;
    const apostila = el('input', { type: 'text', value: a.apostila, placeholder: 'https://… (Google Docs, PDF no Drive…)' });
    const exs = a.exercicios.map(x => Object.assign({}, x));
    const lista = el('div');
    function desenhar() {
      lista.innerHTML = '';
      exs.forEach((x, i) => {
        const t = el('input', { type: 'text', value: x.titulo, maxlength: 80, placeholder: 'Nome do exercício' }); t.oninput = () => { x.titulo = t.value; };
        const d = el('textarea', { rows: 2, maxlength: 400, placeholder: 'Como fazer' }); d.value = x.descricao; d.oninput = () => { x.descricao = d.value; };
        const m = el('input', { type: 'number', min: 0, max: 120, value: x.tempo, style: 'width:90px' }); m.oninput = () => { x.tempo = m.value; };
        lista.append(el('div', { style: 'background:var(--papel);border-radius:10px;padding:10px;margin-bottom:8px' },
          el('div', { class: 'linha entre' }, el('b', {}, '♪ Exercício ' + (i + 1)),
            el('div', { class: 'linha' },
              i > 0 ? el('button', { class: 'bt peq', type: 'button', 'aria-label': 'Subir', onclick: () => { exs.splice(i - 1, 0, exs.splice(i, 1)[0]); desenhar(); } }, '↑') : null,
              i < exs.length - 1 ? el('button', { class: 'bt peq', type: 'button', 'aria-label': 'Descer', onclick: () => { exs.splice(i + 1, 0, exs.splice(i, 1)[0]); desenhar(); } }, '↓') : null,
              el('button', { class: 'bt peq', type: 'button', onclick: () => { exs.splice(i, 1); desenhar(); } }, 'Remover'))),
          el('label', { class: 'campo' }, 'Nome'), t, el('label', { class: 'campo' }, 'Descrição'), d,
          el('label', { class: 'campo' }, 'Tempo (min)'), m));
      });
    }
    desenhar();
    box.append(el('label', { class: 'campo' }, 'Título'), titulo,
      el('label', { class: 'campo' }, 'Conteúdo da aula (o que você ensina)'), conteudo,
      el('label', { class: 'campo' }, 'Tarefa da semana (aparece para o aluno)'), tarefa,
      el('label', { class: 'campo' }, 'Link da apostila (opcional)'), apostila,
      el('div', { class: 'mut', style: 'margin-top:4px' }, 'Use um link que o aluno consiga abrir, como um Google Docs ou PDF compartilhado com "qualquer pessoa com o link".'),
      el('h3', { style: 'margin:16px 0 8px' }, 'Exercícios'), lista,
      el('button', { class: 'bt peq', type: 'button', onclick: () => { exs.push({ id: '', titulo: '', descricao: '', tempo: 5 }); desenhar(); } }, '+ Adicionar exercício'),
      el('div', { class: 'linha', style: 'margin-top:14px' },
        el('button', { class: 'bt pri', type: 'button', onclick: e => acao(e.currentTarget, async () => {
          await chamar('painelSalvarAula', { id: a.id, titulo: titulo.value, conteudo: conteudo.value, tarefa: tarefa.value, apostila: apostila.value }, exs);
          toast('Aula ' + a.numero + ' salva. Os alunos já veem a versão nova.'); await carregar(true);
        }) }, 'Salvar aula'),
        a.apostila ? el('a', { class: 'bt', href: a.apostila, target: '_blank', rel: 'noopener' }, 'Abrir apostila') : null));
    return box;
  }

  // início: dentro da planilha já entra; no app/web usa a sessão salva ou pede a senha
  if (MODO === 'web' && !CHAVE) {
    const salva = ler('violao_sessao');
    if (/^[a-f0-9]{40,64}$/.test(salva)) { CHAVE = salva; carregar(); } else telaLogin();
  } else carregar();
</script>
</body>
